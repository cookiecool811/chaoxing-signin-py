name: chaoxing-signin

on:
  schedule:
    # 每 10 分钟跑一次，错开整点高峰（GitHub 整点附近排队/丢跑最严重）
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}   # 允许在 GitHub 页面手动点按钮触发

# 上一次还没跑完时，新触发的运行直接取消，避免并发对刷
concurrency:
  group: chaoxing-signin
  cancel-in-progress: true

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        run: python run_once.py
        env:
          CHAOXING_PHONE: ${{ secrets.CHAOXING_PHONE }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_ADDRESS: ${{ secrets.CHAOXING_ADDRESS }}
          CHAOXING_DELAY: ${{ secrets.CHAOXING_DELAY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
